name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_ready: ${{ steps.config.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check JavaScript and both deployment bundles
        run: |
          node --check worker.js
          node --check page.js
          npm run build:pages
          cmp page.js pages/dist/_worker.js
          npm run build:worker
      - name: Check deployment configuration
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_TARGET: ${{ vars.CLOUDFLARE_DEPLOY_TARGET || 'pages' }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_TARGET" in
            pages|workers) ;;
            *) echo '::error::CLOUDFLARE_DEPLOY_TARGET must be pages or workers'; exit 1 ;;
          esac
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.'
            echo '### Deployment skipped: Cloudflare credentials are not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$DEPLOY_TARGET" == pages && -z "$PAGES_PROJECT" ]]; then
            echo '::error::Set CLOUDFLARE_PAGES_PROJECT_NAME to the existing Pages project name.'
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production
    needs: check
    if: needs.check.outputs.deploy_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      DEPLOY_TARGET: ${{ vars.CLOUDFLARE_DEPLOY_TARGET || 'pages' }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build and deploy Pages
        if: env.DEPLOY_TARGET == 'pages'
        run: |
          npm run build:pages
          cd pages
          npx --no-install wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA"
      - name: Deploy Worker with Durable Object bindings
        if: env.DEPLOY_TARGET == 'workers'
        run: npx --no-install wrangler deploy --config wrangler.toml --keep-vars
      - name: Deployment summary
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          printf '### Cloudflare deployment succeeded\n\nTarget: `%s`\n\nCommit: `%s`\n' "$DEPLOY_TARGET" "$DEPLOYED_SHA" >> "$GITHUB_STEP_SUMMARY"
